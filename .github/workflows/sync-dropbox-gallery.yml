name: Sync Dropbox Gallery

'on':
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  sync-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync gallery from Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          DROPBOX_GALLERY_FOLDER_PATH: ${{ secrets.DROPBOX_GALLERY_FOLDER_PATH }}
          DROPBOX_GALLERY_MAX_IMAGES: ${{ secrets.DROPBOX_GALLERY_MAX_IMAGES }}
        run: npm run sync:gallery

      - name: Commit updated gallery data
        run: |
          if git diff --quiet; then
            echo "No gallery changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/data/gallery.json
          git commit -m "chore: sync gallery from Dropbox"
          git push
